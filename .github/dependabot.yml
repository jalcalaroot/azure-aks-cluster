version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # azurerm pinned to < 5.0.0 on purpose (providers.tf) - required by
      # the ACR Azure Verified Module, which doesn't support azurerm v5.x
      # yet. Without this, Dependabot keeps proposing a major bump that
      # silently rewrites that pin.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
    groups:
      terraform:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
