# Instalar: pip install pre-commit && pre-commit install (una vez por clon)
# Corre en cada `git commit`, antes de que el commit exista - un secreto
# nunca llega a salir de la máquina, a diferencia de gitleaks en CI (que lo
# atrapa recién cuando ya está en GitHub). terraform_fmt es gratis agregar
# acá: instantáneo, evita el ida-y-vuelta de que el fmt-check de CI rebote
# el PR por indentación.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
