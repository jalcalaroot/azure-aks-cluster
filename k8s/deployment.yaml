# Reemplazar <ACR_LOGIN_SERVER> por el valor real de `terraform output -raw
# acr_login_server` antes de aplicar - ver README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      # Fuerza el scheduling en el Virtual Node (ACI-backed) en vez del nodo
      # real - equivalente a que un Fargate Profile de EKS capture este pod.
      # Sin esto, el scheduler lo pondria en el nodo real "system" como
      # cualquier pod normal.
      nodeSelector:
        kubernetes.io/role: agent
        type: virtual-kubelet
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Exists
        - key: azure.com/aci
          effect: NoSchedule
      # Virtual Nodes NO hereda el AcrPull del kubelet_identity (eso solo
      # aplica al nodo real) - el ACI Connector crea el container group con
      # sus propias credenciales, sin identidad administrada para el pull.
      # Se necesita un secret explicito. Ver README para como generarlo
      # (az acr token create, scope-map _repositories_pull).
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: hello-world
          image: <ACR_LOGIN_SERVER>/hello-world:latest
          ports:
            - containerPort: 80
          # ACI (Virtual Nodes) no tiene overcommit - requests y limits tienen
          # que ser identicos, si no falla con
          # ContainerLimitGreaterThanContainerGroupTotalRequest al crear el
          # container group.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
